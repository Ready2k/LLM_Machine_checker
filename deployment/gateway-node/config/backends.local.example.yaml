backends:
  # The PC running Ollama
  pc-rtx2070:
    provider: ollama
    endpoint: http://pc-ai.local:11434
    enabled: true

  # The M4 MacBook Pro running LM Studio
  # If the gateway is running ON the M4 MacBook, set this to 127.0.0.1:1234
  # If the gateway is running ON the Old MacBook, set this to Jamess-MacBook-Pro-2.local:1234
  macbook-m4pro:
    provider: lmstudio
    endpoint: http://Jamess-MacBook-Pro-2.local:1234
    openai_endpoint: http://Jamess-MacBook-Pro-2.local:1234/v1
    enabled: true
