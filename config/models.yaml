models:
  auto:
    route: local-fast
    model: auto
    provider: auto
    purpose: intelligent auto-routing — gateway selects route based on prompt analysis

  web:
    route: local-quality
    model: auto
    provider: auto
    purpose: web-grounded answers — searches the LAN SearXNG, fetches pages, and cites real sources (auto-routes the synthesis)

  local-fast:
    route: local-fast
    model: qwen2.5-coder:7b
    provider: ollama
    purpose: fast local coding/chat

  local-quality:
    route: local-quality
    model: vMLX_qwen3.6-27b
    provider: openai_compatible
    purpose: higher quality local reasoning/coding

  private-docs:
    route: private-docs
    model: vMLX_qwen3.6-27b
    provider: openai_compatible
    purpose: local-only private document work

  local-fast-llama:
    route: local-fast
    model: llama3.1:8b
    provider: ollama
    purpose: fast local general reasoning/chat (Llama 3.1 8B)

  local-fast-gemma:
    route: local-fast
    model: gemma2:2b
    provider: ollama
    purpose: lightweight fast local chat

  sim:
    route: local-fast-apple
    model: ~/.cache/huggingface/hub/mjdillon/gemma-3-12b-it-qat-mlx-4Bit
    provider: openai_compatible
    purpose: generative agents simulation — fast structured output (Gemma 3 12B QAT)

  cloud-best:
    route: cloud-best
    model: null
    provider: null
    purpose: disabled until explicitly configured
