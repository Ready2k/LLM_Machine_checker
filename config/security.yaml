security:
  default_privacy: personal
  allow_cloud_by_default: false
  allowed_cloud_roles: ["system_admin", "architect"]
  # Enforced by gateway/policy/auth.py when GATEWAY_API_KEYS is set (see README).
  require_api_key_for_lan: true
  prompt_logging_enabled: false

  # Web grounding gate. SearXNG keeps the query on the LAN, but page fetches
  # leave the network — so only allow it for lower-sensitivity tiers. Requests
  # at a disallowed tier still answer, just without web grounding.
  web_search:
    allowed_privacy:
      - public
      - personal

  # Request limits (see gateway/policy/limits.py). 0 disables a limit.
  limits:
    max_body_bytes: 20971520        # 413 above this (Content-Length based)
    rate_limit_per_minute: 0        # per API key / client IP; loopback exempt
    max_tokens_cap: 0               # clamp max_tokens on completions

telemetry:
  enabled: true
  log_prompts: false
  log_completions: false
